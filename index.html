<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="단어암기">
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>단어암기</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,sans-serif;background:#f3f4f6;color:#111}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px #0001}
h1{font-size:20px;margin:0 0 12px}h2{font-size:17px;margin:0 0 10px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-size:16px;margin-top:8px}
button.sub{background:#e5e7eb;color:#111}button.opt{background:#eef2ff;color:#1e1b4b;text-align:left}
button.ok{background:#16a34a}button.ng{background:#dc2626}
input,textarea{width:100%;padding:12px;font-size:18px;border:2px solid #ddd;border-radius:10px}
textarea{height:160px;font-size:14px}
.word{font-size:34px;font-weight:700;text-align:center;margin:10px 0}
.mean{font-size:22px;text-align:center;color:#374151}
.hint{font-size:14px;color:#6b7280;margin-top:8px;line-height:1.5}
.bar{height:8px;background:#e5e7eb;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:#4f46e5}
.row{display:flex;gap:8px}.row button{margin-top:8px}
.tag{display:inline-block;padding:4px 10px;background:#4f46e5;color:#fff;border-radius:20px;font-size:13px}
.fb{text-align:center;font-size:18px;margin-top:10px;min-height:28px}
.hide{display:none}
.pvRow{display:flex;gap:6px;align-items:center;margin-top:6px}.pvRow input{padding:8px;font-size:15px}
.pvRow .w{flex:0 0 42%}.pvRow .x{flex:0 0 36px;padding:8px 0;margin:0;background:#fee2e2;color:#b91c1c;font-size:15px}
.bk{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eee}
.bk .n{color:#9ca3af;font-size:13px;width:26px}.bk .w{font-weight:700;font-size:17px;flex:1}.bk .m{color:#374151;flex:1.2}
.bk .lv{font-size:12px;color:#6b7280;width:34px;text-align:right}.bk button{width:auto;margin:0;padding:6px 8px;font-size:13px;background:#e5e7eb;color:#111}
#pad{width:100%;height:190px;background:#fff;border:2px dashed #a5b4fc;border-radius:12px;touch-action:none;display:block}
</style>
</head>
<body><div class="wrap">

<!-- 홈 -->
<div id="home">
  <h1>📚 단어 암기</h1>
  <div class="card hide" id="installCard">
    <h2>📲 앱으로 설치</h2>
    <p class="hint" id="installHint"></p>
    <button id="installBtn" class="hide" onclick="doInstall()">홈 화면에 설치하기</button>
  </div>
  <div class="card">
    <h2>1. 단어장 등록</h2>
    <p class="hint">사진을 <b>여러 장 한꺼번에</b> 골라도 돼요 (갤러리에서 길게 눌러 여러 장 선택).</p>
    <input type="file" id="photo" accept="image/*" multiple>
    <button class="sub" onclick="document.getElementById('camera').click()">📷 카메라로 한 장씩 찍어 추가</button>
    <input type="file" id="camera" accept="image/*" capture="environment" class="hide">
    <div class="bar" style="margin-top:10px"><i id="ocrBar" style="width:0"></i></div>
    <div id="ocrStatus" class="hint"></div>
    <p class="hint">인식된 글자가 아래에 들어와요. 직접 붙여넣어도 돼요.<br>형식: <b>영어단어 한글뜻</b> (한 줄에 하나)</p>
    <textarea id="raw" placeholder="apple 사과&#10;beautiful 아름다운&#10;..." oninput="previewDirty()"></textarea>
    <button class="sub" onclick="preview()">🔍 인식 결과 확인하기</button>
    <!-- 인식 확인 표 -->
    <div id="pv" class="hide">
      <h2 style="margin-top:14px">인식 확인</h2>
      <p class="hint" id="pvSum"></p>
      <div id="pvRows"></div>
      <div id="pvBad" class="hint"></div>
      <button onclick="loadWords(false)">새 단어장으로 등록 (기존 것 지움)</button>
      <button class="sub" onclick="loadWords(true)">기존 단어장에 추가</button>
    </div>
  </div>
  <div class="card" id="stat"></div>
  <div class="card">
    <button class="sub" onclick="openBook()">📘 단어장 보기 / 고치기</button>
    <button onclick="startStudy()">📖 학습하기 (외우기)</button>
    <button onclick="startQuiz()">✍️ 단계별 검증</button>
    <button onclick="startQuiz(true)" class="sub">❌ 오답만 다시</button>
    <button onclick="if(confirm('초기화할까요?')){localStorage.clear();location.reload()}" class="sub">초기화</button>
  </div>
</div>

<!-- 단어장 보기 -->
<div id="book" class="hide">
  <div class="card">
    <h2>📘 단어장 <span class="hint" id="bookCount"></span></h2>
    <input id="bookSearch" placeholder="검색 (영어·한글)" oninput="renderBook()" style="font-size:15px">
    <p class="hint">단어나 뜻을 누르면 고칠 수 있어요. ⭐ 0~5는 통과한 단계.</p>
    <div id="bookList"></div>
    <button class="sub" onclick="go('home')">홈으로</button>
  </div>
</div>

<!-- 학습 -->
<div id="study" class="hide">
  <div class="card">
    <span class="tag" id="sIdx"></span>
    <div class="word" id="sWord"></div>
    <div class="mean" id="sMean"></div>
    <div class="hint" id="sHint"></div>
    <button class="sub" onclick="speak(cur.w)">🔊 발음 듣기</button>
    <div class="row"><button class="sub" onclick="sMove(-1)">◀</button><button onclick="sMove(1)">다음 ▶</button></div>
    <button class="sub" onclick="go('home')">홈으로</button>
  </div>
</div>

<!-- 퀴즈 -->
<div id="quiz" class="hide">
  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="tag" id="qStage"></span><span class="hint" id="qCount"></span>
    </div>
    <div class="bar"><i id="qBar" style="width:0"></i></div>
    <div class="mean" id="qMean" style="margin-top:16px"></div>
    <div class="word" id="qShow" style="letter-spacing:4px;color:#4f46e5"></div>
    <button class="sub" onclick="speak(cur.w)" style="margin-top:0">🔊 발음 듣기</button>
    
    <!-- 손글씨 입력 -->
    <div id="qPadBox">
      <canvas id="pad"></canvas>
      <div class="hint" style="text-align:center;margin-top:4px">손가락이나 펜으로 영어 단어를 쓰세요 (소문자, 또박또박, 긴 단어는 작게)</div>
      <div class="row"><button class="sub" onclick="padClear()">지우기</button><button onclick="submitPad()">✅ 채점</button></div>
      <div class="row"><button class="sub" onclick="setInputMode('type')">⌨️ 자판으로</button><button class="sub hide" id="padOkBtn" onclick="padOverride()">맞게 썼는데 잘못 읽었어요</button></div>
    </div>
    <!-- 자판 입력 -->
    <div id="qInputBox" class="hide"><input id="qIn" autocomplete="off" autocapitalize="off" placeholder="영어 단어 입력"><button onclick="submitType()">확인</button>
      <button class="sub" onclick="setInputMode('pad')">✍️ 손글씨로</button></div>
    <div class="fb" id="qFb"></div>
    <button class="sub" onclick="go('home')">홈으로</button>
  </div>
</div>

<script>
const STAGE=["","보고 따라 쓰기","철자 채우기","첫글자 힌트","뜻만 보고 쓰기","최종 시험"];
let words=JSON.parse(localStorage.getItem('words')||'[]'), cur, sI=0, queue=[], qI=0, onlyWrong=false;
const save=()=>localStorage.setItem('words',JSON.stringify(words));
const go=id=>{['home','book','study','quiz'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==id));if(id==='home')renderStat();};
const speak=t=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.9;speechSynthesis.speak(u);};  // 버튼을 눌렀을 때만 호출
const shuffle=a=>a.sort(()=>Math.random()-.5);

/* OCR */
let worker=null;                       // OCR 엔진은 한 번만 만들어 두고 재사용 (사진 10장도 빠르게)
async function getWorker(st){
  if(worker)return worker;
  st.textContent='글자 인식 엔진 준비 중... (처음 한 번만 1분 정도)';
  worker=await Tesseract.createWorker('kor+eng');
  await worker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'}); // 6 = 줄 단위 글 덩어리
  return worker;
}
/* 사진 손질: 흑백 → 주변 밝기에 맞춰 또렷하게(조명 얼룩·화면 무늬에 강함) → 두 쪽이면 반으로 나누기 */
function loadImg(file){return new Promise(res=>{const img=new Image();img.onload=()=>res(img);img.src=URL.createObjectURL(file);});}
function cleanCanvas(src,sx,sy,sw,sh){
  const scale=Math.max(1,Math.min(3,1800/sw));
  const c=document.createElement('canvas');c.width=Math.round(sw*scale);c.height=Math.round(sh*scale);
  const g=c.getContext('2d');g.filter='blur(0.7px)';g.drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);g.filter='none'; // 살짝 흐려서 화면 무늬(모아레) 제거
  const W=c.width,H=c.height,im=g.getImageData(0,0,W,H),d=im.data,gray=new Float32Array(W*H);
  for(let i=0,j=0;i<d.length;i+=4,j++)gray[j]=d[i]*.3+d[i+1]*.59+d[i+2]*.11;
  // 적분 영상으로 각 점 주변(창 크기 r)의 평균 밝기를 빠르게 구함
  const I=new Float64Array((W+1)*(H+1));
  for(let y=1;y<=H;y++){let row=0;for(let x=1;x<=W;x++){row+=gray[(y-1)*W+(x-1)];I[y*(W+1)+x]=I[(y-1)*(W+1)+x]+row;}}
  const r=Math.round(W/40);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const x0=Math.max(0,x-r),x1=Math.min(W,x+r+1),y0=Math.max(0,y-r),y1=Math.min(H,y+r+1);
    const mean=(I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0])/((x1-x0)*(y1-y0));
    const v=gray[y*W+x]<mean*0.82?0:255;const i=(y*W+x)*4;d[i]=d[i+1]=d[i+2]=v;
  }
  g.putImageData(im,0,0);return c.toDataURL('image/png');
}
async function prepImages(file){
  const img=await loadImg(file);const w=img.width,h=img.height,out=[];
  if(w>h*1.25){out.push(cleanCanvas(img,0,0,w/2,h));out.push(cleanCanvas(img,w/2,0,w/2,h));} // 가로 사진 = 두 쪽 펼침
  else out.push(cleanCanvas(img,0,0,w,h));
  URL.revokeObjectURL(img.src);return out;
}
async function ocrFiles(files){
  if(!files.length)return;
  const st=document.getElementById('ocrStatus'),bar=document.getElementById('ocrBar'),raw=document.getElementById('raw');
  try{
    const w=await getWorker(st);
    for(let i=0;i<files.length;i++){
      st.textContent=`사진 ${i+1} / ${files.length} 손질 중...`;bar.style.width=(i/files.length*100)+'%';
      const parts=await prepImages(files[i]);
      for(let k=0;k<parts.length;k++){
        st.textContent=`사진 ${i+1} / ${files.length} 인식 중...`+(parts.length>1?` (${k?'오른쪽':'왼쪽'} 쪽)`:'');
        const r=await w.recognize(parts[k]);
        const t=r.data.text.trim();
        if(t)raw.value=(raw.value.trim()?raw.value.trim()+'\n':'')+t+'\n';
      }
      raw.scrollTop=raw.scrollHeight;
    }
    bar.style.width='100%';st.textContent=`${files.length}장 인식 완료!`;
    preview();                                                          // 바로 인식 확인 표 띄우기
  }catch(err){st.textContent='인식 실패. 다시 시도하거나 직접 입력해주세요.';}
}

/* 글 → 단어/뜻 짝 찾기 */
function parseLines(text){
  const ok=[],bad=[];
  const POS='(?:v|vt|vi|n|a|ad|adj|adv|prep|conj|pron|int)';
  for(let l of text.split('\n')){
    const orig=l.trim();if(!orig)continue;
    if(!/[가-힣]/.test(orig)){bad.push(orig);continue;}                           // 한글이 없는 줄(영어 예문 등)은 단어 줄 아님
    // 줄 앞의 잡동사니(번호, |, «, 기호) 제거 — 단, 한글이 3자 이상 앞서 있으면 표제어 줄이 아님
    const pre=orig.match(/^[^A-Za-z]*/)[0];
    if((pre.match(/[가-힣]/g)||[]).length>=3){bad.push(orig);continue;}
    l=orig.slice(pre.length).replace(/[□■☐✓✔★☆※•·▪◦]/g,' ').trim();
    // 표제어 = 줄 맨 앞의 영어 (1~4단어, 뒤에 * 가능) → 발음기호[...]나 (..) → 한글 뜻
    const m=l.match(/^([A-Za-z][A-Za-z']*(?:[ -][A-Za-z']+){0,3})\s*\*{0,3}\s*(?:\[[^\]]*\])?\s*(?:\([^)]*\))?\s*[:\-=,|.]?\s*(.*)$/);
    if(!m){bad.push(orig);continue;}
    let w=m[1].trim().toLowerCase().replace(/\s+/g,' ').replace(new RegExp('\\s+'+POS+'$'),'');
    const toks=w.split(' ');
    // 예문처럼 보이면 제외: 단어가 5개 이상이거나, 원래 줄이 "01 The ..." 꼴
    if(toks.length>4||w.length<3||/^\d{2}\s+[A-Z][a-z]+\s+\w+\s+\w+/.test(pre.trim()+' '+l)||!/[aeiouy]/.test(w)){bad.push(orig);continue;} // '05 In many countries ...' 같은 예문 제외
    let rest=m[2];
    rest=rest.replace(/\((?:=|↔|~|-)[^)]*\)/g,' ');                                // (= look), (↔ minor) 같은 영어 동의·반의어 제거
    rest=rest.replace(/^[^가-힣(]*?(?=[가-힣(])/,'');                              // 뜻 앞 잡음(품사 기호 등) 제거
    rest=rest.replace(/[A-Za-z]{3,}[^가-힣]*$/,'');                                 // 뜻 뒤에 붙은 영어 꼬리 제거
    let mn=rest.replace(/[ㄱ-ㅎㅏ-ㅣ]/g,'').replace(/\d{3,}/g,' ')                    // 깨진 자모, 숫자 덩어리 제거
               .replace(/[^가-힣0-9,.;\s~()/·]/g,' ').replace(/\(\s*\)/g,'').replace(/\s+/g,' ').trim();
    mn=mn.replace(/(^|\s)(\d)[.\s]\s*(?=[가-힣(])/g,'$1$2. ').replace(/\.\s*\./g,'.').replace(/\s*,\s*/g,', ').replace(/[,.;\s]+$/,''); // "1 외모 2 출현" → "1. 외모 2. 출현"
    mn=mn.replace(/\((\d)\.?\s*(?=[가-힣])/g,'$1. ');                             // "(2 보이던" → "2. 보이던"
    if((mn.match(/\(/g)||[]).length!==(mn.match(/\)/g)||[]).length)mn=mn.replace(/[()]/g,''); // 짝이 안 맞는 괄호는 전부 제거
    mn=mn.replace(/^[가-힣]\s+(?=\d)/,'')                                           // 앞의 품사 기호 오독(한 글자) 제거
        .replace(/(\s+(?:\d{1,2}\.?|[가-힣]|[.~,;]+))+$/,'')                       // 뒤에 붙은 번호·한 글자 잡음 제거
        .replace(/\s+\.\s+/g,' ').trim();
    const kor=(mn.match(/[가-힣]/g)||[]).length,all=(mn.match(/[가-힣A-Za-z0-9]/g)||[]).length;
    // 뜻이 너무 짧거나(1글자) 한글 비율이 낮으면 잡음
    if(kor<2||kor<all*0.6||mn.length>60||(toks.length>=3&&kor<4)){bad.push(orig);continue;} // 여러 단어인데 뜻이 짧으면 예문 조각
    ok.push({w,m:mn});
  }
  return{ok,bad};
}
/* 인식 확인 표 */
let pvDirtyFlag=false;
function previewDirty(){pvDirtyFlag=true;}
function preview(){
  const {ok,bad}=parseLines(document.getElementById('raw').value);
  const pv=document.getElementById('pv'),rows=document.getElementById('pvRows');
  pv.classList.remove('hide');rows.innerHTML='';pvDirtyFlag=false;
  ok.forEach(x=>{
    const d=document.createElement('div');d.className='pvRow';
    d.innerHTML=`<input class="w" value="${x.w}" autocapitalize="off"><input class="m" value="${x.m}"><button class="x" onclick="this.parentNode.remove();pvCount()">✕</button>`;
    rows.appendChild(d);
  });
  document.getElementById('pvBad').innerHTML=bad.length?`⚠️ 못 읽은 줄 ${bad.length}개 (위 칸에 직접 쓰거나 무시):<br>`+bad.map(b=>'· '+b.replace(/</g,'&lt;')).join('<br>'):'';
  if(!ok.length&&!bad.length)pv.classList.add('hide');
  pvCount();
}
function pvCount(){const n=document.querySelectorAll('#pvRows .pvRow').length;document.getElementById('pvSum').textContent=`단어 ${n}개를 찾았어요. 틀린 글자는 칸을 눌러 고치고, 필요 없는 줄은 ✕ 로 지우세요.`;}
function pvWords(){return[...document.querySelectorAll('#pvRows .pvRow')].map(r=>({w:r.querySelector('.w').value.trim().toLowerCase(),m:r.querySelector('.m').value.trim()})).filter(x=>x.w&&x.m);}
document.getElementById('photo').onchange=e=>{ocrFiles([...e.target.files]);e.target.value='';};
document.getElementById('camera').onchange=e=>{ocrFiles([...e.target.files]);e.target.value='';};

/* 단어장 등록 — 인식 확인 표에 있는(고친) 내용을 그대로 등록 */
function loadWords(append){
  if(pvDirtyFlag)preview();                       // 글을 고친 뒤 확인표를 안 눌렀으면 다시 읽기
  const list=[],seen=new Set(append?words.map(x=>x.w):[]);
  for(const x of pvWords()){if(seen.has(x.w))continue;seen.add(x.w);list.push({w:x.w,m:x.m,lv:0,wrong:0});}
  if(!list.length)return alert(append?'새로 추가할 단어가 없어요.':'등록할 단어가 없어요. 인식 결과 확인 표를 먼저 봐주세요.');
  if(!append&&words.length&&!confirm(`기존 단어장(${words.length}개)을 지우고 새로 만들까요?`))return;
  words=append?words.concat(list):list;save();renderStat();
  document.getElementById('raw').value='';document.getElementById('ocrStatus').textContent='';document.getElementById('ocrBar').style.width='0';
  document.getElementById('pv').classList.add('hide');
  alert(list.length+'개 단어 '+(append?'추가':'등록')+' 완료! (총 '+words.length+'개)');
  openBook();                                     // 등록 직후 단어장을 보여줘서 바로 확인
}

/* 단어장 보기(교과서처럼) + 고치기 */
function openBook(){go('book');document.getElementById('bookSearch').value='';renderBook();}
function renderBook(){
  const q=document.getElementById('bookSearch').value.trim().toLowerCase();
  const list=document.getElementById('bookList');list.innerHTML='';
  document.getElementById('bookCount').textContent=`총 ${words.length}개`;
  if(!words.length){list.innerHTML='<p class="hint">등록된 단어가 없어요.</p>';return;}
  words.forEach((x,i)=>{
    if(q&&!x.w.includes(q)&&!x.m.includes(q))return;
    const d=document.createElement('div');d.className='bk';
    d.innerHTML=`<span class="n">${i+1}</span><span class="w" onclick="editWord(${i},'w')">${x.w}</span><span class="m" onclick="editWord(${i},'m')">${x.m}</span>
      <span class="lv">${'⭐'.repeat(Math.min(x.lv,5))||'·'}${x.wrong?'<br>❌'+x.wrong:''}</span>
      <button onclick="speak('${x.w.replace(/'/g,"\\'")}')">🔊</button><button onclick="delWord(${i})">✕</button>`;
    list.appendChild(d);
  });
}
function editWord(i,f){
  const v=prompt(f==='w'?'영어 단어 고치기':'뜻 고치기',words[i][f]);if(v===null)return;
  const t=f==='w'?v.trim().toLowerCase():v.trim();if(!t)return;
  words[i][f]=t;save();renderBook();
}
function delWord(i){if(confirm(`'${words[i].w}' 를 지울까요?`)){words.splice(i,1);save();renderBook();}}
function renderStat(){
  const done=words.filter(w=>w.lv>=5).length;
  document.getElementById('stat').innerHTML=words.length?`<h2>진행 상황</h2><div class="bar"><i style="width:${done/words.length*100}%"></i></div>
  <p class="hint">총 ${words.length}개 · 완료 ${done}개 · 오답누적 ${words.filter(w=>w.wrong>0).length}개</p>`:'<p class="hint">등록된 단어장이 없어요.</p>';
}

/* 암기 힌트 자동 생성 */
function makeHint(w){
  const h=[];const pre={un:'반대(un-)',re:'다시(re-)',dis:'반대/분리(dis-)',pre:'미리(pre-)',im:'반대(im-)',in:'반대/안(in-)'};
  const suf={tion:'명사(-tion)',ly:'부사(-ly)',ful:'~가득한(-ful)',less:'~없는(-less)',er:'사람/도구(-er)',ness:'명사(-ness)',able:'할수있는(-able)'};
  for(const p in pre)if(w.startsWith(p)&&w.length>p.length+2)h.push('접두사 '+pre[p]);
  for(const s in suf)if(w.endsWith(s)&&w.length>s.length+2)h.push('접미사 '+suf[s]);
  h.push(`철자 ${w.length}글자 · 소리내어 3번 읽고 눈 감고 써보기`);
  const sim=words.filter(x=>x.w!==w&&(x.w.slice(0,3)===w.slice(0,3)));
  if(sim.length)h.push('비슷한 단어: '+sim.map(x=>x.w).join(', '));
  return h.join('<br>');
}

/* 학습 모드 */
function startStudy(){if(!words.length)return alert('단어장을 먼저 등록하세요');sI=0;go('study');showStudy();}
function showStudy(){cur=words[sI];document.getElementById('sIdx').textContent=(sI+1)+' / '+words.length;
  document.getElementById('sWord').textContent=cur.w;document.getElementById('sMean').textContent=cur.m;
  document.getElementById('sHint').innerHTML=makeHint(cur.w);}
function sMove(d){sI=(sI+d+words.length)%words.length;showStudy();}

/* 검증 모드 */
function startQuiz(wrong=false){
  if(!words.length)return alert('단어장을 먼저 등록하세요');onlyWrong=wrong;
  let pool=words.filter(w=>w.lv<5&&(!wrong||w.wrong>0));
  if(!pool.length)return alert(wrong?'오답이 없어요!':'🎉 모든 단어를 완벽히 외웠어요!');
  const minLv=Math.min(...pool.map(w=>w.lv));queue=shuffle(pool.filter(w=>w.lv===minLv));qI=0;go('quiz');ask();
}
function ask(){
  if(qI>=queue.length){alert('이번 라운드 끝! 계속 진행합니다.');return startQuiz(onlyWrong);}
  cur=queue[qI];const st=cur.lv+1;
  document.getElementById('qStage').textContent=st+'단계 · '+STAGE[st];
  document.getElementById('qCount').textContent=(qI+1)+'/'+queue.length;
  document.getElementById('qBar').style.width=(cur.lv/5*100)+'%';
  document.getElementById('qMean').textContent=cur.m;document.getElementById('qFb').textContent='';
  const show=document.getElementById('qShow'),ib=document.getElementById('qInputBox'),inp=document.getElementById('qIn');
  show.textContent='';inp.value='';
  if(st===1){show.textContent=cur.w;}           // 단어를 보여주고 그대로 입력
  if(st===2){const a=cur.w.split('');for(let i=1;i<a.length-1;i++)if(Math.random()<.5)a[i]='_';show.textContent=a.join('');}
  if(st===3)show.textContent=cur.w[0]+'_'.repeat(cur.w.length-1);
  setInputMode(inputMode);                                    // 손글씨/자판 중 마지막에 쓰던 방식으로
  if(inputMode==='pad')padClear();
}
document.getElementById('qIn').addEventListener('keydown',e=>{if(e.key==='Enter')submitType();});
function submitType(){judge(document.getElementById('qIn').value.trim().toLowerCase()===cur.w);}

/* ---------- 손글씨 입력 ---------- */
let inputMode=localStorage.getItem('inputMode')||'pad', drawing=false, strokes=0, judging=false;
const pad=document.getElementById('pad'), pctx=pad.getContext('2d');
function padResize(){const r=pad.getBoundingClientRect();if(!r.width)return;pad.width=r.width*2;pad.height=r.height*2;padClear();}
function padClear(){pctx.fillStyle='#fff';pctx.fillRect(0,0,pad.width,pad.height);
  pctx.strokeStyle='#e5e7eb';pctx.lineWidth=2;pctx.beginPath();pctx.moveTo(0,pad.height*.72);pctx.lineTo(pad.width,pad.height*.72);pctx.stroke(); // 기준선
  pctx.strokeStyle='#111';pctx.lineWidth=7;pctx.lineCap='round';pctx.lineJoin='round';strokes=0;
  document.getElementById('padOkBtn').classList.add('hide');}
const pos=e=>{const r=pad.getBoundingClientRect();return[(e.clientX-r.left)*2,(e.clientY-r.top)*2];};
pad.addEventListener('pointerdown',e=>{drawing=true;strokes++;pad.setPointerCapture(e.pointerId);const[x,y]=pos(e);pctx.beginPath();pctx.moveTo(x,y);pctx.lineTo(x+.1,y);pctx.stroke();});
pad.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pos(e);pctx.lineTo(x,y);pctx.stroke();});
['pointerup','pointercancel','pointerleave'].forEach(t=>pad.addEventListener(t,()=>drawing=false));
window.addEventListener('resize',padResize);
function setInputMode(m){inputMode=m;localStorage.setItem('inputMode',m);
  document.getElementById('qPadBox').classList.toggle('hide',m!=='pad');document.getElementById('qInputBox').classList.toggle('hide',m!=='type');
  if(m==='pad')setTimeout(padResize,0);else document.getElementById('qIn').focus();}
let hwWorker=null;                     // 손글씨 전용 인식 엔진 (영어 소문자만 읽도록 설정)
async function getHwWorker(){
  if(hwWorker)return hwWorker;
  const w=await Tesseract.createWorker('eng');
  await w.setParameters({tessedit_char_whitelist:'abcdefghijklmnopqrstuvwxyz',tessedit_pageseg_mode:'7'}); // 7 = 한 줄로 취급
  hwWorker=w;return w;
}
function padImage(){                  // 글씨 주변만 잘라서 여백을 두고 넘김 (인식률 ↑)
  const d=pctx.getImageData(0,0,pad.width,pad.height).data;let x0=pad.width,y0=pad.height,x1=0,y1=0;
  for(let y=0;y<pad.height;y++)for(let x=0;x<pad.width;x++){const i=(y*pad.width+x)*4;if(d[i]<100){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
  if(x1<x0)return null;
  const m=40,c=document.createElement('canvas');c.width=x1-x0+m*2;c.height=y1-y0+m*2;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(pad,x0,y0,x1-x0,y1-y0,m,m,x1-x0,y1-y0);
  return c.toDataURL('image/png');
}
async function submitPad(){
  if(judging)return;const fb=document.getElementById('qFb');
  if(!strokes)return fb.textContent='먼저 글씨를 써주세요.';
  judging=true;fb.innerHTML='<span style="color:#6b7280">읽는 중...</span>';
  try{
    const w=await getHwWorker();const r=await w.recognize(padImage());
    const read=(r.data.text||'').toLowerCase().replace(/[^a-z]/g,'');
    if(read===cur.w)judge(true);
    else{
      fb.innerHTML=`<span style="color:#dc2626">❌ 읽은 글자: <b>${read||'(없음)'}</b> · 정답: <b>${cur.w}</b></span>`;
      document.getElementById('padOkBtn').classList.remove('hide');   // 인식이 틀린 경우를 위한 버튼
      pendingWrong=true;setTimeout(padConfirmWrong,3000);              // 3초 안에 버튼 안 누르면 오답 처리
    }
  }catch(e){fb.textContent='인식 실패. 다시 써보거나 자판을 이용하세요.';}
  judging=false;
}
let pendingWrong=false;
function padOverride(){pendingWrong=false;document.getElementById('padOkBtn').classList.add('hide');judge(true);}
function padConfirmWrong(){if(pendingWrong){pendingWrong=false;judge(false);}}
function judge(ok){
  const fb=document.getElementById('qFb');
  if(ok){cur.lv++;fb.innerHTML='<span style="color:#16a34a">⭕ 정답!</span>';}
  else{cur.wrong++;cur.lv=Math.max(0,cur.lv-1);fb.innerHTML=`<span style="color:#dc2626">❌ 정답: <b>${cur.w}</b></span>`;}
  save();qI++;setTimeout(ask,ok?700:1800);
}

/* PWA 설치 안내 */
let installEvt=null;
const isStandalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function showInstallCard(){
  if(isStandalone)return; // 이미 앱으로 실행 중
  const card=document.getElementById('installCard'),hint=document.getElementById('installHint'),btn=document.getElementById('installBtn');
  card.classList.remove('hide');
  if(installEvt){hint.textContent='버튼을 누르면 홈 화면에 앱 아이콘이 생겨요.';btn.classList.remove('hide');}
  else if(isIOS)hint.innerHTML='Safari에서 아래 <b>공유(⬆) 버튼</b> → <b>홈 화면에 추가</b>를 누르면 앱처럼 쓸 수 있어요.';
  else hint.innerHTML='Chrome 메뉴(⋮) → <b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 누르면 앱처럼 쓸 수 있어요.';
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;showInstallCard();});
window.addEventListener('appinstalled',()=>{document.getElementById('installCard').classList.add('hide');});
async function doInstall(){if(!installEvt)return;installEvt.prompt();await installEvt.userChoice;installEvt=null;}
showInstallCard();

/* 오프라인용 서비스 워커 등록 (file:// 로 열면 동작 안 함, 사이트로 올려야 함) */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw&&nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          if(confirm('새 버전이 있어요. 지금 새로고침할까요?'))location.reload();
        }
      });
    });
  }).catch(()=>{});
}
renderStat();
