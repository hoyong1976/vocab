# ─────────────────────────────────────────────────────────────
#  단어암기 앱 → 안드로이드 APK 빌드  (3단계: ML Kit 으로 사진 속 글자 읽기)
#
#  이 파일이 하는 일 (위에서 아래로):
#   1) 깨끗한 리눅스 컴퓨터를 하나 빌려서(ubuntu) 자바를 깐다
#   2) 안드로이드 프로젝트 폴더를 "그 자리에서" 만든다
#      - index.html 을 앱 안의 assets 폴더로 복사 (앱이 이 파일을 화면에 띄움)
#      - MainActivity.kt = 앱이 켜질 때 실행되는 코드. WebView(작은 브라우저)에 index.html 을 연다
#   3) gradle 이라는 빌드 도구로 APK 를 굽는다 (10분쯤)
#   4) 구운 APK 를 Release 에 올린다 → 폰에서 내려받아 설치
# ─────────────────────────────────────────────────────────────
name: Build APK

on:
  workflow_dispatch:          # Actions 탭에서 "Run workflow" 버튼으로 직접 실행
  push:
    paths:                    # 이 파일들이 바뀌어 올라오면 자동 실행
      - 'index.html'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write             # Release 를 만들 권한

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4            # 저장소 파일 가져오기

      - uses: actions/setup-java@v4          # 안드로이드 빌드엔 자바 17 필요
        with:
          distribution: temurin
          java-version: '17'

      # ── 2) 안드로이드 프로젝트 만들기 ─────────────────────────
      - name: Create Android project
        run: |
          set -e
          mkdir -p app/src/main/java/kr/hy/vocab
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values

          # 웹앱 파일을 앱 안으로 복사 (index.html 하나만 있으면 됨)
          cp index.html app/src/main/assets/index.html
          cp icon-512.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          # settings.gradle: "이 프로젝트엔 app 이라는 모듈이 하나 있다"
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = 'vocab'
          include ':app'
          EOF

          # build.gradle: 어떤 빌드 도구 버전을 쓸지
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.5.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
            }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # app/build.gradle: 앱 이름(패키지), 지원 안드로이드 버전, 서명 키
          #   ※ 3단계에서 여기 dependencies 에 ML Kit 한 줄이 추가될 예정
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'

          android {
            namespace 'kr.hy.vocab'
            compileSdk 34

            defaultConfig {
              applicationId 'kr.hy.vocab'      // 폰 안에서 이 앱을 구분하는 이름. 바꾸면 "다른 앱"이 됨
              minSdk 26                        // 안드로이드 8 이상
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }

            signingConfigs {                   // APK 서명 (저장소의 vocab.keystore 사용)
              app {
                storeFile file('../vocab.keystore')
                storePassword 'vocab1234'
                keyAlias 'vocab'
                keyPassword 'vocab1234'
              }
            }

            buildTypes {
              release {
                signingConfig signingConfigs.app
                minifyEnabled false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
          }

          dependencies {
            // 구글 ML Kit 글자 인식 (한국어+영어 모델이 앱 안에 들어감 → 오프라인 동작)
            implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
          }
          EOF

          # 앱 이름 (홈 화면에 보이는 글자)
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">단어암기</string>
          </resources>
          EOF

          # AndroidManifest.xml: 앱의 "신분증". 어떤 화면(Activity)이 있고 어떤 권한이 필요한지
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <application
              android:allowBackup="true"
              android:icon="@mipmap/ic_launcher"
              android:label="@string/app_name"
              android:theme="@android:style/Theme.Material.Light.NoActionBar">

              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:launchMode="singleTask">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>

            </application>
          </manifest>
          EOF

          # MainActivity.kt: 앱이 켜지면 실행되는 코드 (코틀린 언어)
          #   [2단계] 다리: 웹 → AndroidBridge.pickImage() → 사진 고르기 창
          #   [3단계] 고른 사진을 ML Kit 에 넘겨 글자를 읽고 → 웹의 onOcrText(글) 로 돌려준다
          cat > app/src/main/java/kr/hy/vocab/MainActivity.kt <<'EOF'
          package kr.hy.vocab

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.korean.KoreanTextRecognizerOptions
          import org.json.JSONObject

          class MainActivity : Activity() {
            private lateinit var web: WebView
            private val PICK_IMAGE = 1

            // ML Kit 글자 인식기 (한국어 모델). 한 번 만들어 계속 재사용
            private val recognizer by lazy { TextRecognition.getClient(KoreanTextRecognizerOptions.Builder().build()) }

            inner class Bridge {
              @JavascriptInterface
              fun pickImage() {
                val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                i.addCategory(Intent.CATEGORY_OPENABLE)
                i.type = "image/*"
                i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)          // 여러 장 선택 허용
                runOnUiThread { startActivityForResult(i, PICK_IMAGE) }
              }
            }

            override fun onCreate(saved: Bundle?) {
              super.onCreate(saved)
              web = WebView(this)
              setContentView(web)
              web.settings.javaScriptEnabled = true
              web.settings.domStorageEnabled = true
              web.settings.allowFileAccess = true
              web.webViewClient = WebViewClient()
              web.addJavascriptInterface(Bridge(), "AndroidBridge")
              web.loadUrl("file:///android_asset/index.html")
            }

            // 사진 고르기 창이 닫히면: 고른 사진들을 하나씩 ML Kit 에 넘긴다
            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
              super.onActivityResult(requestCode, resultCode, data)
              if (requestCode != PICK_IMAGE || resultCode != RESULT_OK || data == null) return
              val uris = ArrayList<Uri>()
              val clip = data.clipData
              if (clip != null) for (k in 0 until clip.itemCount) uris.add(clip.getItemAt(k).uri)
              else data.data?.let { uris.add(it) }
              if (uris.isEmpty()) return
              js("onOcrStart(${uris.size})")
              recognizeNext(uris, 0)
            }

            // uris[idx] 를 읽고, 끝나면 다음 사진으로 (재귀)
            private fun recognizeNext(uris: List<Uri>, idx: Int) {
              if (idx >= uris.size) { js("onOcrDone()"); return }
              try {
                // fromFilePath = 사진의 회전 정보(EXIF)까지 알아서 처리해 줌
                val image = InputImage.fromFilePath(this, uris[idx])
                recognizer.process(image)
                  .addOnSuccessListener { result ->
                    val text = linesInReadingOrder(result)
                    js("onOcrText(${JSONObject.quote(text)}, ${idx + 1}, ${uris.size})")
                    recognizeNext(uris, idx + 1)
                  }
                  .addOnFailureListener { e ->
                    js("onAndroidError(${JSONObject.quote("인식 실패: " + e.message)})")
                    recognizeNext(uris, idx + 1)
                  }
              } catch (e: Exception) {
                js("onAndroidError(${JSONObject.quote("사진 열기 실패: " + e.message)})")
                recognizeNext(uris, idx + 1)
              }
            }

            // ML Kit 은 글자를 "덩어리(block) > 줄(line)" 로 주는데, 두 열짜리 단어장은 덩어리 순서가 뒤섞인다.
            // 그래서 모든 줄을 세로 위치(y)로 정렬하고, 같은 높이의 줄은 가로 위치(x) 순으로 이어 붙여
            // "radical**   형 1. 급진적인, 과격한" 처럼 실제 한 줄을 복원한다.
            private fun linesInReadingOrder(result: com.google.mlkit.vision.text.Text): String {
              data class L(val y: Int, val x: Int, val h: Int, val t: String)
              val all = ArrayList<L>()
              for (b in result.textBlocks) for (ln in b.lines) {
                val r = ln.boundingBox ?: continue
                all.add(L(r.centerY(), r.left, r.height(), ln.text))
              }
              all.sortBy { it.y }
              val rows = ArrayList<ArrayList<L>>()
              for (l in all) {
                val last = rows.lastOrNull()
                if (last != null && Math.abs(last[0].y - l.y) < Math.max(last[0].h, l.h) * 0.6) last.add(l)
                else rows.add(arrayListOf(l))
              }
              return rows.joinToString("\n") { row -> row.sortedBy { it.x }.joinToString("  ") { it.t } }
            }

            // 웹 쪽 함수를 부르는 도우미 (항상 화면 스레드에서)
            private fun js(code: String) { runOnUiThread { web.evaluateJavascript(code, null) } }

            override fun onBackPressed() {
              if (web.canGoBack()) web.goBack() else super.onBackPressed()
            }
          }
          EOF

      # ── 3) APK 굽기 ─────────────────────────────────────────
      - name: Build
        run: |
          set -e
          if ! command -v gradle >/dev/null 2>&1; then
            curl -sL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
            unzip -q gradle.zip
            export PATH="$PWD/gradle-8.9/bin:$PATH"
          fi
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 4) Release 에 올리기 ─────────────────────────────────
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/release/app-release.apk vocab.apk
          gh release create "apk-${{ github.run_number }}" vocab.apk \
            --title "단어암기 앱 v${{ github.run_number }}" \
            --notes "휴대폰에서 vocab.apk 를 눌러 설치하세요."
